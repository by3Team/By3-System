name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@5e931af6be0e018f807de246b52f546bfb8da48a # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Backend
        run: |
          cd backend
          dotnet restore By3.slnx
          dotnet build By3.slnx -c Release --no-restore
          dotnet publish By3.Api/By3.Api.csproj -c Release -o ./publish /p:UseAppHost=false

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Package Backend
        run: |
          cd backend/publish
          tar -czf ../../by3-api-${{ github.ref_name }}-linux-x64.tar.gz .

      - name: Package Frontend
        run: |
          tar -czf by3-frontend-${{ github.ref_name }}.tar.gz -C frontend/dist .

      - name: Create Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          generate_release_notes: true
          files: |
            by3-api-${{ github.ref_name }}-linux-x64.tar.gz
            by3-frontend-${{ github.ref_name }}.tar.gz
